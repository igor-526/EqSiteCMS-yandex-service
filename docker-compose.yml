name: yandex-service

services:
  app:
    build: .
    container_name: yandex-service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db-yandex
    ports:
      - "8006:8000"
    volumes:
      - ./src:/app/src:${DEV_MOUNT:-rw}
    networks:
      - eqsitecms-network
    command: >-
      sh -c "uv run --no-sync alembic -c src/alembic.ini upgrade head &&
      uv run --no-sync uvicorn main:app --app-dir src --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src"

  migrations:
    build: .
    container_name: yandex-service-migrations
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db-yandex
    volumes:
      - ./src:/app/src:${DEV_MOUNT:-rw}
    networks:
      - eqsitecms-network
    command: uv run --no-sync alembic -c src/alembic.ini upgrade head
    depends_on:
      - app

networks:
  eqsitecms-network:
    external: true
